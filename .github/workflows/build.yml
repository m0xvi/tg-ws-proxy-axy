name: Build & Release Universal (Android APK + iOS IPA)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Создать GitHub Release с этим тегом (например, v2.0.0). Оставьте пустым для обычной сборки в Artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust Core & FFI Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check & Test Rust Core
        run: |
          cargo check --manifest-path Cargo.toml --locked
          cargo test --manifest-path Cargo.toml --release --lib

      - name: FFI Smoke Test
        run: ./scripts/run-ffi-smoke.sh

  android:
    name: Android APK (arm64 + arm32 + universal)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Core (.so) for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          chmod +x ./scripts/build-rust-android.sh
          ./scripts/build-rust-android.sh

      - name: Build Release APKs (signed with debug/release config)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
          mkdir -p dist-android
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist-android/ \;
          ls -lh dist-android/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist-android/*.apk

  ios:
    name: iOS IPA (free + vpn)
    runs-on: macos-14
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build unsigned IPAs (free & vpn)
        run: |
          chmod +x ./build.sh ./scripts/build-rust-ios.sh
          ./build.sh
          ./build.sh --vpn
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipas
          path: dist/*.ipa

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets

      - name: Download iOS IPAs
        uses: actions/download-artifact@v4
        with:
          name: ios-ipas
          path: release-assets

      - name: Determine Release Tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag_name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "TG WS Proxy Universal ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.ipa
          body: |
            ## 📱 Скачать (Android & iOS)

            ### 🤖 Android (`.apk`)
            - **`app-arm64-release.apk`** — рекомендуется для всех современных Android-смартфонов (ARM64 / 64-bit)
            - **`app-arm32-release.apk`** — для старых 32-битных устройств (`armeabi-v7a`)
            - **`app-universal-release.apk`** — универсальный APK (содержит обе архитектуры)

            ### 🍏 iOS (`.ipa`)
            - **`TgWsProxy-free.ipa`** — для установки через **AltStore / SideStore / Sideloadly** с обычным бесплатным Apple ID (фоновый режим работает через геолокацию `CoreLocation`)
            - **`TgWsProxy-vpn.ipa`** — для установки через **TrollStore / ESign / Feather** или платный сертификат разработчика (фоновый режим через системный `NetworkExtension PacketTunnel`)

            ---
            ### 🚀 Что включено в ядро (Rust 2.0)
            - Обход DPI/ТСПУ в мобильных сетях: разделение `TLS ClientHello` на 3 TLS-рекорда посреди SNI + TCP-фрагментация `HTTP Host`
            - Автоматическая мультипортовая гонка Cloudflare (`80`, `2052`, `8080`, `443`, `8443`) и пул чистых Anycast IP (`IPv4` + `IPv6`)
            - Устойчивый DoH-резолвер (Яндекс DoH + прямой `8.8.8.8` + Google/AdGuard/Cloudflare)
            - Поддержка любых пользовательских доменов (`.ru`, `.com`, `*.workers.dev`, `*.pages.dev`)
            - Автоматический сброс пулов при переключении `Wi-Fi ↔ Мобильная сеть`
