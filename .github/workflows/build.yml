name: Build Universal (Rust Core + Android APK + iOS IPA)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust Core & FFI Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Rust Core
        run: cargo check --manifest-path Cargo.toml --locked

      - name: FFI Smoke Test
        run: ./scripts/run-ffi-smoke.sh

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Rust Core (.so) for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: ./scripts/build-rust-android.sh

      - name: Build Android Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (${{ matrix.name }})
    runs-on: macos-15
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: free
            flags: ""
          - name: vpn
            flags: "--vpn"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build IPA
        run: ./build.sh ${{ matrix.flags }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-ios-${{ matrix.name }}
          path: dist/TgWsProxy-${{ matrix.name }}.ipa
          if-no-files-found: error
