name: Build & Release Universal (Android APK + iOS IPA)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Создать GitHub Release с этим тегом (например, v2.0.0). Оставьте пустым для обычной сборки в Artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust Core & FFI Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check & Test Rust Core
        run: |
          cargo check --manifest-path Cargo.toml
          cargo test --manifest-path Cargo.toml --release --lib

      - name: FFI Smoke Test
        run: |
          chmod +x ./scripts/run-ffi-smoke.sh
          sh ./scripts/run-ffi-smoke.sh

  android:
    name: Android APK (arm64 + arm32 + universal)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify preinstalled Android SDK & NDK on ubuntu-latest
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ -z "${ANDROID_NDK_LATEST_HOME:-}" ] || [ ! -d "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            if [ -d "$ANDROID_HOME/ndk" ] && [ -n "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
              NDK_DIR="$(ls -1d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)"
              echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            else
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
            fi
          else
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Rust Core (.so) for Android
        run: |
          chmod +x ./scripts/build-rust-android.sh
          sh ./scripts/build-rust-android.sh

      - name: Build Release APKs (signed)
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            RAW_TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_TAG="v2.0.${{ github.run_number }}"
          fi
          VER_NAME="${RAW_TAG#v}"
          VER_CODE=$(( 200 + ${{ github.run_number }} ))
          chmod +x ./gradlew
          sh ./gradlew assembleRelease -PappVersionName="$VER_NAME" -PappVersionCode="$VER_CODE" --no-daemon
          mkdir -p dist-android
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist-android/ \;
          ls -lh dist-android/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist-android/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (free + vpn)
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build unsigned IPAs (free & vpn)
        run: |
          chmod +x ./build.sh ./scripts/build-rust-ios.sh
          ./build.sh
          ./build.sh --vpn
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipas
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets

      - name: Download iOS IPAs
        uses: actions/download-artifact@v4
        with:
          name: ios-ipas
          path: release-assets

      - name: Determine Release Tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag_name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v2.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "KiiXY ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.ipa
          body: |
            ## 🚀 KiiXY ${{ steps.tag.outputs.tag_name }}

            **Изменения в этой версии**

            - **Исправлены периодические отвалы на проблемном провайдере:** при включённом Cloudflare ядро теперь проходит всю цепочку дальше — прямой WS с SNI-fronting, затем TCP/FakeTLS к датацентрам Telegram на порту `443` — вместо `no fallback available` и обрыва соединения.
            - **Штраф порта 80 живёт все 5 минут:** после сбросов `101 → 0B` запрет на `:80` не отменяется сменой сети, пересбором кандидатов и настройкой `DISABLE_SECURE`; все CF-подключения принудительно идут на TLS `443`.
            - **Sticky DNS + backoff:** при отказе системного резолвера возвращается последний рабочий IP вместо лавины `failed to lookup address information`; повторы подавлены на 2 с, доменный кандидат исключён в 3-с grace после переключения сети, пулы пересоздаются с задержкой 1.5 с.
            - **Анти-шторм:** 12 отказов за 3 с включают 8-с паузу CF-гонок с уходом в прямой fallback, одинаковые ошибки пишутся в лог не чаще раза в 2 с.
            - **Фоновые проверки и авто-восстановление (особенно iOS):** `IsProxyRunning()`, watchdog Network Extension раз в 10 с, проверки приложения по таймеру / foreground / смене сети / VPN-статуса / `BGAppRefreshTask` и вручную; Android foreground-сервис проверяет TCP-порт.
            - Поведение маршрутов покрыто unit-тестом `test_network_state_survives_network_change`; CI проверяет `cargo check`, `cargo test --release --lib` и C FFI smoke.

            ---

            ## 📱 Скачать (Android & iOS)

            ### 🤖 Android (`.apk`)
            - **`app-arm64-release.apk`** — рекомендуется для всех современных Android-смартфонов (ARM64 / 64-bit)
            - **`app-arm32-release.apk`** — для старых 32-битных устройств (`armeabi-v7a`)
            - **`app-universal-release.apk`** — универсальный APK (содержит обе архитектуры)

            ### 🍏 iOS (`.ipa`)
            - **`TgWsProxy-free.ipa`** — для установки через **AltStore / SideStore / Sideloadly** с обычным бесплатным Apple ID (фоновый режим работает через геолокацию `CoreLocation`)
            - **`TgWsProxy-vpn.ipa`** — для установки через **TrollStore / ESign / Feather** или платный сертификат разработчика (фоновый режим через системный `NetworkExtension PacketTunnel`)

            ---
            ### 🚀 Что включено в ядро (Rust 2.0)
            - Обход DPI/ТСПУ в мобильных сетях: разделение `TLS ClientHello` на 3 TLS-рекорда посреди SNI + TCP-фрагментация `HTTP Host`
            - Автоматическая мультипортовая гонка Cloudflare (`80`, `2052`, `8080`, `443`, `8443`) и пул чистых Anycast IP (`IPv4` + `IPv6`)
            - Устойчивый DoH-резолвер (Яндекс DoH + прямой `8.8.8.8` + Google/AdGuard/Cloudflare)
            - Поддержка любых пользовательских доменов (`.ru`, `.com`, `*.workers.dev`, `*.pages.dev`)
            - Автоматический сброс пулов при переключении `Wi-Fi ↔ Мобильная сеть`
